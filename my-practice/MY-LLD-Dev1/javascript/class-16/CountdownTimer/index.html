<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Countdown Timer</h1>

    <div>
        <input type="text" name="hh" id="h-inp" placeholder="HH">
        <span>:</span>
        <input type="text" name="mm" id="m-inp" placeholder="MM">
        <span>:</span>
        <input type="text" name="ss" id="s-inp" placeholder="SS">

        <button id="start-btn">Start</button>
    </div>
    <h2 id="timer-display">00:00:00</h2>
    <script src="script.js"></script>
</body>

</html>
