  <script id="solution">
    // Update the code given below to implement the debouncing functionality ======================================

    let timer;
    let tPrice = 0;
    let btns = document.querySelectorAll("button");
    let pricetext = document.querySelector("p span");

    function addToCard(e) {
      let target = e.currentTarget || e.target;
      let price = Number(target.getAttribute("data-price"));
      tPrice += price;
      pricetext.innerText = tPrice;
    }

    const addToCardDebounce = debounce(addToCard, 300);

    for (let i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", addToCardDebounce);
    }



    function debounce(fn, delay) {
      let timerId = null;

      return function (...args) {
        clearTimeout(timerId);

        timerId = setTimeout(() => {
          fn(...args);
        }, delay);
      }
    }
  </script>
</body>
